<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>{{ page.title | default: site.title }}</title>
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css" />
  </head>
  <body>
    <div class="site-header">
      <div class="container">
        {% unless page.url == "/" %}
          <div class="site-title">ZIWEI LI</div>
        {% endunless %}
        <nav class="site-nav">
          <a href="{{ site.baseurl }}/" class="{% if page.url == '/' %}active{% endif %}">home</a>
          <a href="{{ site.baseurl }}/cv" class="{% if page.url == '/cv' %}active{% endif %}">cv</a>
          <a href="{{ site.baseurl }}/projects" class="{% if page.url == '/projects' or page.url contains '/projects/' %}active{% endif %}">project</a>
        </nav>
      </div>
    </div>

    <main class="container-wide">
      {{ content }}
      <div style="margin-top: 3rem;">
        <a href="{{ site.baseurl }}/projects">← 返回项目页</a>
      </div>
    </main>
  </body>
</html>
