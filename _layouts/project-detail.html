<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="site-header-inner">
        {% if page.url != "/" %}
          <div class="site-title">ZIWEI LI</div>
        {% else %}
          <div class="site-title"></div> <!-- 保留占位 -->
        {% endif %}
        <nav class="site-nav">
          <a href="{{ site.baseurl }}/" class="{% if page.url == '/' %}active{% endif %}">home</a>
          <a href="{{ site.baseurl }}/cv" class="{% if page.url == '/cv' %}active{% endif %}">cv</a>
          <a href="{{ site.baseurl }}/projects" class="{% if page.url == '/projects' %}active{% endif %}">project</a>
        </nav>
      </div>
    </div>
  </header>

    <main class="container-wide">
      {{ content }}
      <div style="margin-top: 3rem;">
        <a href="{{ site.baseurl }}/projects">← 返回项目页</a>
      </div>
    </main>
  </body>
</html>
