<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{{ page.title | default: site.title }}</title>
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css" />
  </head>
  <body>
    <header class="site-header">
      {% if page.url != "/" %}
        <div class="site-title">Masahiro Hirano</div>
      {% endif %}
      <nav class="site-nav">
        <a href="{{ site.baseurl }}/" class="{% if page.url == '/' %}active{% endif %}">home</a>
        <a href="{{ site.baseurl }}/cv" class="{% if page.url == '/cv' %}active{% endif %}">cv</a>
        <a href="{{ site.baseurl }}/projects" class="{% if page.url == '/projects' %}active{% endif %}">project</a>
      </nav>
    </header>

    <main class="{% if page.layout == 'project-detail' %}container-wide{% else %}container{% endif %}">
      {{ content }}
    </main>
  </body>
</html>
