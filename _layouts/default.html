<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="site-header-inner">
        <!-- 始终保留 .site-title ，首页留空，其他页显示名字 -->
        <div class="site-title">
          {% unless page.url == "/" %}
            ZIWEI LI
          {% endunless %}
        </div>
        <nav class="site-nav">
          <a href="{{ site.baseurl }}/"
             class="{% if page.url == '/' %}active{% endif %}">home</a>
          <a href="{{ site.baseurl }}/cv"
             class="{% if page.url == '/cv' %}active{% endif %}">cv</a>
          <a href="{{ site.baseurl }}/projects"
             class="{% if page.url == '/projects' %}active{% endif %}">project</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="{% if page.layout == 'project-detail' %}container-wide{% else %}container{% endif %}">
    {{ content }}
  </main>
</body>
</html>
