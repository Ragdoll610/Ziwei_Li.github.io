
<div style="display: inline-block; width: 300px; margin: 10px; vertical-align: top; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden;">
  <img src="{{ include.image }}" alt="{{ include.title }}" style="width:100%; height:180px; object-fit:cover;">
  <div style="padding: 10px; text-align: left;">
    <strong>{{ include.title }}</strong><br>
    <small>{{ include.year }}</small><br><br>
    <a href="{{ include.link }}"><button style="padding: 6px 12px; border: 1px solid #ccc; background: #f9f9f9;">詳細</button></a>
  </div>
</div>
